name: CI

on:
  push:
    branches-ignore: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    # 毎週金曜日 3:00 JST (= 木曜日 18:00 UTC)
    - cron: '0 18 * * 4'

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    permissions:
      pull-requests: read
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      typecheck: ${{ steps.filter.outputs.typecheck }}
      test: ${{ steps.filter.outputs.test }}
    steps:
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          # push 時: develop と比較
          # pull_request 時: デフォルトで PR ベースブランチと比較
          base: ${{ github.event_name == 'push' && 'develop' || '' }}
          filters: |
            lint:
              - '.github/**'
              - 'src/**'
              - 'amplify/**'
              - '*.md'
              - '*.json'
              - '*.ts'
              - '*.html'
              - '.kiro/**'
            typecheck:
              - 'src/**'
              - 'amplify/**'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'package.json'
              - 'package-lock.json'
            test:
              - 'src/**'
              - 'vitest.config.ts'
              - 'vite.config.ts'
              - 'package.json'
              - 'package-lock.json'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: |
      !(failure() || cancelled())
        && (needs.changes.outputs.lint == 'true' || github.event_name == 'schedule')
    steps:
      - uses: actions/checkout@v4

      - name: Prepare CI environment
        uses: ./.github/actions/prepare-ci

      - name: Run lint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: changes
    if: |
      !(failure() || cancelled())
        && (needs.changes.outputs.typecheck == 'true' || github.event_name == 'schedule')
    steps:
      - uses: actions/checkout@v4

      - name: Prepare CI environment
        uses: ./.github/actions/prepare-ci
        with: { with-amplify-outputs: true }

      - name: Run typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: |
      !(failure() || cancelled())
        && (needs.changes.outputs.test == 'true' || github.event_name == 'schedule')
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - name: Prepare CI environment
        uses: ./.github/actions/prepare-ci
        with: { with-amplify-outputs: true }

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Coverage summary
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const summary = require('./coverage/coverage-summary.json');
              const total = summary.total;
              console.log('| Metric | Coverage |');
              console.log('|--------|----------|');
              console.log('| Lines | ' + total.lines.pct + '% |');
              console.log('| Statements | ' + total.statements.pct + '% |');
              console.log('| Functions | ' + total.functions.pct + '% |');
              console.log('| Branches | ' + total.branches.pct + '% |');
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage summary not available" >> $GITHUB_STEP_SUMMARY
          fi

  check:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test
    if: always()
    steps:
      - name: CI 結果チェック
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
