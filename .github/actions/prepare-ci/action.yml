name: 'Prepare CI'
description: 'Setup Node.js, install dependencies, and generate amplify_outputs.json stub'

inputs:
  with-amplify-outputs:
    description: "amplify_outputs.json 出力"
    required: false
    default: "false"

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      shell: bash
      run: npm ci

    # TODO: AWS クレデンシャル設定後、以下のスタブ生成を削除し、
    #       npx ampx generate outputs --app-id ${{ secrets.AMPLIFY_APP_ID }} --branch main
    #       に置き換える。参考: https://docs.amplify.aws/react/deploy-and-host/fullstack-branching/custom-pipelines/
    - name: Generate amplify_outputs.json stub for CI
      shell: bash
      if: "${{ inputs.with-amplify-outputs == 'true' }}"
      run: |
        cat > amplify_outputs.json << 'EOF'
        {
          "auth": {
            "user_pool_id": "stub",
            "aws_region": "ap-northeast-1",
            "user_pool_client_id": "stub",
            "identity_pool_id": "stub",
            "mfa_methods": [],
            "standard_required_attributes": ["email"],
            "username_attributes": ["email"],
            "user_verification_types": ["email"],
            "groups": [],
            "mfa_configuration": "NONE",
            "password_policy": {
              "min_length": 8,
              "require_lowercase": true,
              "require_numbers": true,
              "require_symbols": true,
              "require_uppercase": true
            },
            "unauthenticated_identities_enabled": true
          },
          "data": {
            "url": "https://stub.appsync-api.ap-northeast-1.amazonaws.com/graphql",
            "aws_region": "ap-northeast-1",
            "default_authorization_type": "AWS_IAM",
            "authorization_types": ["AMAZON_COGNITO_USER_POOLS"],
            "model_introspection": {
              "version": 1,
              "models": {
                "Environment": {
                  "name": "Environment",
                  "fields": {
                    "id": { "name": "id", "isArray": false, "type": "ID", "isRequired": true, "attributes": [] },
                    "ttl": { "name": "ttl", "isArray": false, "type": "Int", "isRequired": true, "attributes": [] },
                    "finishedAt": { "name": "finishedAt", "isArray": false, "type": "AWSDateTime", "isRequired": false, "attributes": [] },
                    "events": { "name": "events", "isArray": true, "type": { "model": "Event" }, "isRequired": false, "attributes": [], "isArrayNullable": true, "association": { "connectionType": "HAS_MANY", "associatedWith": ["environmentID"] } },
                    "createdAt": { "name": "createdAt", "isArray": false, "type": "AWSDateTime", "isRequired": false, "attributes": [], "isReadOnly": true },
                    "updatedAt": { "name": "updatedAt", "isArray": false, "type": "AWSDateTime", "isRequired": false, "attributes": [], "isReadOnly": true }
                  },
                  "syncable": true,
                  "pluralName": "Environments",
                  "attributes": [
                    { "type": "model", "properties": {} },
                    { "type": "auth", "properties": { "rules": [{ "allow": "public", "provider": "iam", "operations": ["create", "update", "delete", "read"] }] } }
                  ],
                  "primaryKeyInfo": { "isCustomPrimaryKey": false, "primaryKeyFieldName": "id", "sortKeyFieldNames": [] }
                },
                "Event": {
                  "name": "Event",
                  "fields": {
                    "id": { "name": "id", "isArray": false, "type": "ID", "isRequired": true, "attributes": [] },
                    "environmentID": { "name": "environmentID", "isArray": false, "type": "ID", "isRequired": true, "attributes": [] },
                    "type": { "name": "type", "isArray": false, "type": { "enum": "EventType" }, "isRequired": true, "attributes": [] },
                    "payload": { "name": "payload", "isArray": false, "type": "AWSJSON", "isRequired": true, "attributes": [] },
                    "occurredAt": { "name": "occurredAt", "isArray": false, "type": "AWSDateTime", "isRequired": true, "attributes": [] },
                    "consumed": { "name": "consumed", "isArray": false, "type": "Boolean", "isRequired": false, "attributes": [] },
                    "environment": { "name": "environment", "isArray": false, "type": { "model": "Environment" }, "isRequired": false, "attributes": [], "association": { "connectionType": "BELONGS_TO", "targetNames": ["environmentID"] } },
                    "createdAt": { "name": "createdAt", "isArray": false, "type": "AWSDateTime", "isRequired": false, "attributes": [], "isReadOnly": true },
                    "updatedAt": { "name": "updatedAt", "isArray": false, "type": "AWSDateTime", "isRequired": false, "attributes": [], "isReadOnly": true }
                  },
                  "syncable": true,
                  "pluralName": "Events",
                  "attributes": [
                    { "type": "model", "properties": {} },
                    { "type": "key", "properties": { "name": "byEnvironment", "queryField": "listEventByEnvironmentIDAndOccurredAt", "fields": ["environmentID", "occurredAt"] } },
                    { "type": "auth", "properties": { "rules": [{ "allow": "public", "provider": "iam", "operations": ["create", "update", "delete", "read"] }] } }
                  ],
                  "primaryKeyInfo": { "isCustomPrimaryKey": false, "primaryKeyFieldName": "id", "sortKeyFieldNames": [] }
                }
              },
              "enums": {
                "EventType": { "name": "EventType", "values": ["INITIALIZE", "JOIN", "LEAVE", "GENERATE", "RETRY", "FINISH"] }
              },
              "nonModels": {}
            }
          },
          "version": "1.4"
        }
        EOF
